<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<!-- Copertine per YouTube (2560×1440) e Facebook (1640×624), nello stile del sito.
     ?f=youtube o ?f=facebook. Tutto il testo sta nella zona che ogni social mostra sempre (al centro). -->
<style>
@font-face { font-family: 'Tight'; src: url('../node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Mono'; src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 800; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body { background: #0a0a0a; overflow: hidden; position: relative; color: #fff; display: grid; place-items: center; }
body::before { content: ''; position: absolute; inset: 0; background-image:
  radial-gradient(3px 3px at 8% 30%, rgba(255,255,255,.5), transparent), radial-gradient(2.4px 2.4px at 21% 72%, rgba(255,255,255,.35), transparent),
  radial-gradient(2.4px 2.4px at 37% 18%, rgba(255,255,255,.4), transparent), radial-gradient(3px 3px at 55% 84%, rgba(255,255,255,.3), transparent),
  radial-gradient(2.2px 2.2px at 66% 22%, rgba(255,255,255,.35), transparent), radial-gradient(2.6px 2.6px at 83% 64%, rgba(255,255,255,.4), transparent),
  radial-gradient(2.2px 2.2px at 94% 22%, rgba(255,255,255,.3), transparent), radial-gradient(2.4px 2.4px at 13% 88%, rgba(255,255,255,.3), transparent),
  radial-gradient(2.4px 2.4px at 74% 90%, rgba(255,255,255,.3), transparent), radial-gradient(2px 2px at 30% 50%, rgba(255,255,255,.25), transparent),
  linear-gradient(90deg, transparent calc(25% - 1px), rgba(255,255,255,.04) 25%, transparent calc(25% + 1px), transparent calc(50% - 1px), rgba(255,255,255,.04) 50%, transparent calc(50% + 1px), transparent calc(75% - 1px), rgba(255,255,255,.04) 75%, transparent calc(75% + 1px)); }
.zona { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 6%; }
.motto { font-family: 'Tight'; font-weight: 800; letter-spacing: -.05em; line-height: .95; white-space: nowrap; }
.motto span { color: #8a8a8a; }
.motto i { display: inline-block; width: .2em; height: .2em; background: #e30613; margin-left: .05em; }
.servizi { display: grid; text-align: right; font-family: 'Mono'; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: #a3a3a3; white-space: nowrap; }
.servizi b { color: #fff; font-weight: 500; }
/* YouTube: la zona sicura è 1546×423 al centro */
.youtube .zona { width: 1440px; height: 423px; }
.youtube .motto { font-size: 128px; }
.youtube .servizi { font-size: 30px; gap: 20px; }
/* Facebook: su telefono si vede solo il centro (circa 1100×624) */
.facebook .zona { width: 1040px; height: 400px; }
.facebook .motto { font-size: 88px; }
.facebook .servizi { font-size: 21px; gap: 14px; }
</style></head>
<body>
  <div class="zona">
    <p class="motto">I tuoi desideri,<br><span>in codice</span><i></i></p>
    <div class="servizi"><span><b>Automazioni AI</b></span><span>Gestionali</span><span>Siti · E-commerce · Ads</span><span>Milano</span></div>
  </div>
  <script>document.body.className = new URLSearchParams(location.search).get('f') || 'youtube';</script>
</body></html>
