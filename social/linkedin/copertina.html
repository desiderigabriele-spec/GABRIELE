<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<!-- Copertina della pagina aziendale LinkedIn, 1128×191 (disegnata al doppio, 2256×382, per gli schermi nitidi).
     A sinistra in basso LinkedIn mette il logo della pagina: lì non c'è niente di importante. -->
<style>
@font-face { font-family: 'Tight'; src: url('../../node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Mono'; src: url('../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 800; }
* { margin: 0; box-sizing: border-box; }
body { width: 2256px; height: 382px; background: #0a0a0a; overflow: hidden; position: relative; color: #fff; }
body::before { content: ''; position: absolute; inset: 0; background-image:
  radial-gradient(2.4px 2.4px at 8% 30%, rgba(255,255,255,.5), transparent), radial-gradient(2px 2px at 21% 72%, rgba(255,255,255,.35), transparent),
  radial-gradient(2px 2px at 37% 18%, rgba(255,255,255,.4), transparent), radial-gradient(2.4px 2.4px at 55% 80%, rgba(255,255,255,.3), transparent),
  radial-gradient(1.8px 1.8px at 66% 26%, rgba(255,255,255,.35), transparent), radial-gradient(2.2px 2.2px at 83% 64%, rgba(255,255,255,.4), transparent),
  radial-gradient(1.8px 1.8px at 94% 22%, rgba(255,255,255,.3), transparent), radial-gradient(2px 2px at 47% 46%, rgba(255,255,255,.25), transparent),
  linear-gradient(90deg, transparent calc(25% - 1px), rgba(255,255,255,.04) 25%, transparent calc(25% + 1px), transparent calc(50% - 1px), rgba(255,255,255,.04) 50%, transparent calc(50% + 1px), transparent calc(75% - 1px), rgba(255,255,255,.04) 75%, transparent calc(75% + 1px)); }
.motto { position: absolute; left: 640px; top: 92px; font-family: 'Tight'; font-weight: 800; font-size: 112px; letter-spacing: -.05em; line-height: .95; }
.motto span { color: #8a8a8a; }
.motto i { display: inline-block; width: .2em; height: .2em; background: #e30613; margin-left: .05em; }
.servizi { position: absolute; right: 120px; top: 110px; display: grid; gap: 18px; text-align: right; font-family: 'Mono'; font-weight: 500; font-size: 30px; letter-spacing: .16em; text-transform: uppercase; color: #a3a3a3; }
.servizi b { color: #fff; font-weight: 500; }
</style></head>
<body>
  <p class="motto">I tuoi desideri,<br><span>in codice</span><i></i></p>
  <div class="servizi"><span><b>Automazioni AI</b> · Gestionali</span><span>Siti · E-commerce · Ads</span><span>Milano</span></div>
</body></html>
