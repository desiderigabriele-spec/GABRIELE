<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Studio Desideri · intro social</title>
<!-- Video intro per i social (motion graphics). Ogni fotogramma si disegna con disegna(t), t in secondi:
     render.mjs lo apre a 1080×1920 (Reels, TikTok, Storie) o 1080×1080 (post) e salva i fotogrammi per ffmpeg.
     ?t=5 mostra un fotogramma fermo, ?play fa partire l'animazione nel browser. -->
<style>
  @font-face { font-family: 'Bricolage'; src: url('../../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2') format('woff2'); font-weight: 200 800; }
  @font-face { font-family: 'Inter'; src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Instrument'; src: url('../../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2') format('woff2'); font-style: italic; }
  @font-face { font-family: 'Mono'; src: url('../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 800; }
  :root { --notte: #05070f; --latte: #f2f4f8; --nebbia: #9fa8bd; --blu: #3d7bff; --blu-chiaro: #9cc0ff; --ambra: #ffb547; --rosso: #ff3347; --firma: linear-gradient(100deg, #3d7bff 0%, #5cc8ff 55%, #9fe8ff 100%); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--notte); color: var(--latte); }
  #scena { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(70% 45% at 50% 42%, #0d1630 0%, var(--notte) 70%); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #alone { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(61,123,255,.38), rgba(61,123,255,0) 65%); pointer-events: none; }
  #marchio { position: absolute; overflow: visible; }
  .blocco { position: absolute; left: 0; right: 0; display: grid; justify-items: center; text-align: center; }
  .riga { display: block; overflow: hidden; padding: .04em .1em .1em; }
  .riga > span { display: inline-block; }
  .titolo { font-family: 'Bricolage'; font-weight: 800; letter-spacing: -0.045em; line-height: .96; }
  .em { font-family: 'Instrument'; font-style: italic; font-weight: 400; letter-spacing: .01em; background: var(--firma); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .08em; }
  .mono { font-family: 'Mono'; font-weight: 400; letter-spacing: .18em; text-transform: uppercase; color: var(--blu-chiaro); }
  .studio { font-family: 'Inter'; font-weight: 500; letter-spacing: .5em; text-transform: uppercase; padding-left: .5em; }
  .nome { font-family: 'Bricolage'; font-weight: 800; letter-spacing: -0.05em; line-height: .9; }
  .motto { font-family: 'Instrument'; font-style: italic; }
  .piede { font-family: 'Mono'; letter-spacing: .16em; text-transform: uppercase; color: var(--nebbia); }
  .punto-piede { display: inline-block; width: .55em; height: .55em; border-radius: 50%; background: var(--rosso); margin: 0 .7em; vertical-align: .1em; box-shadow: 0 0 .8em var(--rosso); }
</style>
</head>
<body>
<div id="scena">
  <canvas id="cielo"></canvas>
  <div id="alone"></div>
  <svg id="marchio" viewBox="0 0 507.1 402.1" aria-hidden="true">
    <defs><clipPath id="clip-palpebra"><circle id="taglio" cx="145.6" cy="53.6" r="0" /></clipPath></defs>
    <g id="g-sfera"><path fill="#F2F4F8" fill-rule="evenodd" d="M155.6 15.6C63.6 38.6 -0.4 120.6 0.6 209.6C1.6 315.6 83.6 401.6 191.6 401.6C262.6 401.6 330.6 365.6 368.6 306.6C342.6 323.6 311.6 317.6 284.6 306.6C222.6 281.6 175.6 235.6 146.6 181.6C114.6 121.6 110.6 54.6 155.6 15.6Z"/></g>
    <g id="g-occhio">
      <g clip-path="url(#clip-palpebra)"><path fill="#3D7BFF" fill-rule="evenodd" d="M145.6 53.6C170.6 3.6 210.6 -9.4 255.6 7.6C336.6 37.6 396.6 126.6 401.6 210.6C389.6 144.6 347.6 96.6 297.6 64.6C247.6 34.6 194.6 29.6 145.6 53.6Z"/></g>
      <g id="g-iride"><path id="iride" fill="#FFB547" fill-rule="evenodd" d="M367.7 292.7C332 315.8 269.9 283.5 229 220.5C188.1 157.5 183.9 87.7 219.5 64.5C255.2 41.4 317.3 73.7 358.2 136.7C399.1 199.7 403.3 269.5 367.7 292.7ZM367 222.1C353.1 231.1 326 214 306.4 183.9C286.9 153.8 282.3 122.1 296.2 113.1C310.1 104.1 337.2 121.2 356.8 151.3C376.3 181.4 380.9 213.1 367 222.1Z"/>
        <circle id="riflesso" cx="339.6" cy="129.6" r="8" fill="#F2F4F8"/></g>
    </g>
    <circle id="punto" cx="477.6" cy="45.6" r="29" fill="#FF3347"/>
  </svg>

  <div class="blocco" id="b-titolo">
    <span class="riga titolo"><span>Trasformiamo</span></span>
    <span class="riga titolo"><span>chi ti guarda</span></span>
    <span class="riga titolo"><span>in chi ti <span class="em" id="sceglie">sceglie.</span></span></span>
  </div>

  <div class="blocco" id="b-servizi">
    <span class="riga mono" id="etichetta"><span>Cosa facciamo</span></span>
    <span class="riga titolo servizio"><span>Siti web</span></span>
    <span class="riga titolo servizio"><span>Negozi <span class="em">online</span></span></span>
    <span class="riga titolo servizio"><span>Software <span class="em">con AI</span></span></span>
    <span class="riga titolo servizio"><span>Pubblicità</span></span>
  </div>

  <div class="blocco" id="b-firma">
    <span class="riga studio"><span>Studio</span></span>
    <span class="riga nome"><span>Desideri</span></span>
    <span class="riga motto"><span class="em">Dal primo sguardo al sì.</span></span>
    <span class="riga piede"><span>Siti web · AI · Pubblicità</span></span>
    <span class="riga piede"><span>Milano<i class="punto-piede"></i>Italia e Svizzera</span></span>
  </div>
  <canvas id="particelle"></canvas>
</div>

<script>
  const W = innerWidth, H = innerHeight, U = Math.min(W, H) / 1080, VERT = H / W > 1.4;
  const $ = (s) => document.querySelector(s);
  const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const fra = (t, a, b) => cl((t - a) / (b - a));
  const eOut = (x) => 1 - Math.pow(1 - x, 3);
  const eInOut = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const eBack = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const mix = (a, b, k) => a + (b - a) * k;
  let seme = 7; const rnd = () => ((seme = (seme * 16807) % 2147483647) / 2147483647);

  // ---------- misure del testo (proporzionali al lato corto) ----------
  document.querySelectorAll('.titolo').forEach((el) => { el.style.fontSize = `${(VERT ? 132 : 112) * U}px`; });
  $('#etichetta').style.fontSize = `${32 * U}px`;
  $('#b-firma .studio').style.fontSize = `${30 * U}px`;
  $('#b-firma .nome').style.fontSize = `${(VERT ? 190 : 150) * U}px`;
  $('#b-firma .motto').style.fontSize = `${(VERT ? 74 : 60) * U}px`;
  document.querySelectorAll('#b-firma .piede').forEach((el) => { el.style.fontSize = `${30 * U}px`; });
  $('#b-titolo').style.top = `${H * (VERT ? .44 : .45)}px`;
  $('#b-servizi').style.top = `${H * (VERT ? .44 : .44)}px`;
  $('#b-firma').style.top = `${H * (VERT ? .55 : .52)}px`;
  $('#b-firma .motto').style.marginTop = `${26 * U}px`;
  $('#b-firma .piede').style.marginTop = `${(VERT ? 90 : 46) * U}px`;
  $('#etichetta').style.marginBottom = `${18 * U}px`;
  const servizi = [...document.querySelectorAll('.servizio')];
  servizi.forEach((s) => { s.style.position = 'absolute'; s.style.top = `${60 * U}px`; });

  // ---------- il cielo stellato ----------
  const cielo = $('#cielo'), cx = cielo.getContext('2d');
  cielo.width = W; cielo.height = H;
  const stelle = Array.from({ length: VERT ? 700 : 480 }, () => ({ x: rnd() * W, y: rnd() * H, z: .25 + rnd() * .75, f: rnd() * 6.28, c: rnd() < .12 ? '#9fe8ff' : rnd() < .06 ? '#ffb547' : '#f2f4f8' }));
  const stellaCadente = { a: 5.0, d: 1.1 };
  function warp(t) { return Math.exp(-Math.pow((t - 3.35) / .22, 2)) + Math.exp(-Math.pow((t - 9.05) / .22, 2)); }
  function disegnaCielo(t) {
    cx.clearRect(0, 0, W, H);
    const luce = eOut(fra(t, 0, 1.2)), w = warp(t);
    // la salita: lenta, con due accelerate nei passaggi di scena
    const salita = t * 22 * U + (cl((t - 3.1) / .5) + cl((t - 8.8) / .5)) * 260 * U;
    for (const s of stelle) {
      const y = ((s.y - salita * s.z) % H + H) % H;
      const tw = .55 + .45 * Math.sin(t * 2.2 + s.f);
      const r = (.6 + s.z * 1.5) * U * 1.6;
      cx.globalAlpha = luce * tw * (.35 + .65 * s.z);
      cx.fillStyle = s.c; cx.strokeStyle = s.c;
      if (w > .02) {
        cx.lineWidth = r * 1.4; cx.lineCap = 'round';
        cx.beginPath(); cx.moveTo(s.x, y); cx.lineTo(s.x, y + w * 180 * U * s.z); cx.stroke();
      } else { cx.beginPath(); cx.arc(s.x, y, r, 0, 6.283); cx.fill(); }
    }
    // una stella cadente mentre compare il titolo
    const k = fra(t, stellaCadente.a, stellaCadente.a + stellaCadente.d);
    if (k > 0 && k < 1) {
      const x0 = W * .9, y0 = H * .08, x1 = W * .25, y1 = H * .3;
      const px = mix(x0, x1, eOut(k)), py = mix(y0, y1, eOut(k));
      const g = cx.createLinearGradient(px, py, px + (x0 - x1) * .25, py + (y0 - y1) * .25);
      g.addColorStop(0, 'rgba(242,244,248,.95)'); g.addColorStop(1, 'rgba(242,244,248,0)');
      cx.globalAlpha = Math.sin(k * Math.PI); cx.strokeStyle = g; cx.lineWidth = 3 * U;
      cx.beginPath(); cx.moveTo(px, py); cx.lineTo(px + (x0 - x1) * .25, py + (y0 - y1) * .25); cx.stroke();
    }
    cx.globalAlpha = 1;
  }

  // ---------- il marchio: si compone, sbatte le palpebre, guarda, cambia colore ----------
  const marchio = $('#marchio'), alone = $('#alone');
  const RAPP = 402.1 / 507.1;
  // dove sta il marchio: [tempo, centro x, centro y, larghezza]
  const posti = VERT
    ? [[0, .5, .42, .62], [3.0, .5, .42, .62], [3.6, .5, .25, .34], [8.8, .5, .25, .34], [9.5, .5, .36, .44]]
    : [[0, .5, .45, .5], [3.0, .5, .45, .5], [3.6, .5, .22, .26], [8.8, .5, .22, .26], [9.5, .5, .3, .34]];
  function posto(t) {
    let i = 0; while (i < posti.length - 1 && t > posti[i + 1][0]) i++;
    const a = posti[i], b = posti[Math.min(i + 1, posti.length - 1)];
    const k = b === a ? 0 : eInOut(fra(t, a[0], b[0]));
    return [mix(a[1], b[1], k) * W, mix(a[2], b[2], k) * H, mix(a[3], b[3], k) * W];
  }
  const sc = (cxv, cyv, s) => `translate(${cxv} ${cyv}) scale(${s}) translate(${-cxv} ${-cyv})`;
  const COLORI = ['#FFB547', '#FF6B8A', '#A98BFF', '#5CE1E6']; // sito, negozi, software, pubblicità
  function disegnaMarchio(t) {
    const [x, y, l] = posto(t), h = l * RAPP;
    Object.assign(marchio.style, { left: `${x - l / 2}px`, top: `${y - h / 2}px`, width: `${l}px`, height: `${h}px` });
    const ra = l * 1.5;
    Object.assign(alone.style, { left: `${x - ra / 2}px`, top: `${y - ra / 2}px`, width: `${ra}px`, height: `${ra}px`, opacity: String(.5 + .5 * eOut(fra(t, 1, 2.4))) });
    // 1 · la sfera si apre dal centro
    $('#g-sfera').setAttribute('transform', sc(190, 210, eBack(fra(t, .9, 1.7)) || .0001));
    // 2 · la palpebra si disegna da sinistra a destra
    $('#taglio').setAttribute('r', String(eOut(fra(t, 1.35, 2.15)) * 300));
    // 3 · l'iride cresce, poi sbatte le palpebre e si guarda intorno
    let s = eBack(fra(t, 1.6, 2.3)), sy = 1, dx = 0, dy = 0;
    const blink = (a) => { const k = fra(t, a, a + .26); return k > 0 && k < 1 ? 1 - Math.sin(k * Math.PI) * .92 : 1; };
    sy = blink(2.7) * blink(10.3);
    dx = (eInOut(fra(t, 3.7, 4.1)) - eInOut(fra(t, 5.6, 6.0))) * -14 + (eInOut(fra(t, 6.6, 6.9)) - eInOut(fra(t, 8.9, 9.3))) * 10;
    dy = (eInOut(fra(t, 6.6, 6.9)) - eInOut(fra(t, 8.9, 9.3))) * 8;
    $('#g-iride').setAttribute('transform', `translate(${dx} ${dy}) translate(295 178) scale(${s || .0001} ${(s || .0001) * sy}) translate(-295 -178)`);
    $('#riflesso').setAttribute('transform', sc(339.6, 129.6, eBack(fra(t, 2.2, 2.5)) || .0001));
    // il colore dell'iride segue il servizio di cui parliamo
    let col = COLORI[0];
    servizi.forEach((_, i) => { if (t >= 6.6 + i * .6) col = COLORI[i]; });
    if (t >= 9.05) col = COLORI[0];
    $('#iride').setAttribute('fill', col);
    // 4 · il punto rosso: nasce al centro, poi salta al suo posto e batte
    const k = eInOut(fra(t, .9, 1.9));
    const px = mix(253.5, 477.6, k), py = mix(201, 45.6, k);
    const nasce = eBack(fra(t, .25, .7));
    const batte = 1 + .18 * Math.max(0, Math.sin((t - 2) * 4.2)) * (t > 10.6 ? 1 : .35);
    $('#punto').setAttribute('cx', px); $('#punto').setAttribute('cy', py);
    $('#punto').setAttribute('r', String(Math.max(.0001, 29 * nasce * batte * mix(1.6, 1, k))));
    marchio.style.filter = `drop-shadow(0 0 ${30 * U}px rgba(61,123,255,${.35 * eOut(fra(t, 1, 2.4))}))`;
  }

  // ---------- le righe entrano ed escono da sotto una «tenda» ----------
  function riga(el, entra, esce, dur = .55) {
    const a = eOut(fra(entra, 0, dur)), b = esce == null ? 0 : eInOut(fra(esce, 0, .45));
    el.firstElementChild.style.transform = `translateY(${(1 - a) * 115 - b * 115}%)`;
    el.style.visibility = a > 0 && b < 1 ? 'visible' : 'hidden';
  }
  function disegnaTesti(t) {
    const tit = [...document.querySelectorAll('#b-titolo .riga')];
    tit.forEach((el, i) => riga(el, t - (3.55 + i * .22), t - (6.15 + i * .06)));
    // «sceglie.» nasce dalle stelle: la parola vera compare quando le stelle sono arrivate
    $('#sceglie').style.opacity = String(fra(t, 5.05, 5.4));
    riga($('#etichetta'), t - 6.45, t - 8.75);
    servizi.forEach((el, i) => riga(el, t - (6.6 + i * .6), i < 3 ? t - (7.05 + i * .6) : t - 8.8, .4));
    const fir = [...document.querySelectorAll('#b-firma .riga')];
    fir.forEach((el, i) => riga(el, t - (9.35 + i * .18), null, .65));
  }

  // ---------- particelle della parola «sceglie.» ----------
  const pc = $('#particelle'), px = pc.getContext('2d');
  pc.width = W; pc.height = H;
  let punti = [];
  function preparaParticelle() {
    const el = $('#sceglie'), r = el.getBoundingClientRect(), cs = getComputedStyle(el);
    const off = document.createElement('canvas'); off.width = W; off.height = H;
    const o = off.getContext('2d');
    o.font = `italic 400 ${cs.fontSize} Instrument`;
    o.textBaseline = 'alphabetic';
    const g = o.createLinearGradient(r.left, 0, r.right, 0);
    g.addColorStop(0, '#3d7bff'); g.addColorStop(.55, '#5cc8ff'); g.addColorStop(1, '#9fe8ff');
    o.fillStyle = g;
    const m = o.measureText('sceglie.');
    o.fillText('sceglie.', r.left + (r.width - m.width) / 2, r.top + m.fontBoundingBoxAscent + (r.height - m.fontBoundingBoxAscent - m.fontBoundingBoxDescent) / 2);
    const d = o.getImageData(0, 0, W, H).data, passo = Math.round(4 * U) || 3;
    for (let yy = Math.floor(r.top); yy < r.bottom; yy += passo) for (let xx = Math.floor(r.left); xx < r.right; xx += passo) {
      const i = (yy * W + xx) * 4;
      if (d[i + 3] > 150) punti.push({ tx: xx, ty: yy, x: rnd() * W, y: rnd() * H, c: `rgb(${d[i]},${d[i + 1]},${d[i + 2]})`, rit: (xx - r.left) / r.width * .35 + rnd() * .2, r: (.9 + rnd() * 1.2) * U * 1.5 });
    }
  }
  function disegnaParticelle(t) {
    px.clearRect(0, 0, W, H);
    const sparisce = 1 - fra(t, 5.15, 5.6);
    if (t < 4.2 || sparisce <= 0) return;
    for (const p of punti) {
      const k = eInOut(fra(t, 4.2 + p.rit, 5.0 + p.rit));
      px.globalAlpha = (.3 + .7 * k) * sparisce;
      px.fillStyle = p.c;
      px.beginPath(); px.arc(mix(p.x, p.tx, k), mix(p.y, p.ty, k), p.r, 0, 6.283); px.fill();
    }
    px.globalAlpha = 1;
  }

  // ---------- un fotogramma ----------
  window.DURATA = 12;
  window.disegna = (t) => {
    disegnaCielo(t); disegnaMarchio(t); disegnaTesti(t); disegnaParticelle(t);
    // dissolvenza finale molto breve: il video si può mettere in loop
    $('#scena').style.opacity = String(1 - fra(t, 11.75, 12));
  };
  window.pronto = Promise.all([
    document.fonts.load(`800 100px Bricolage`), document.fonts.load(`italic 400 100px Instrument`),
    document.fonts.load(`500 30px Inter`), document.fonts.load(`400 30px Mono`),
  ]).then(() => document.fonts.ready).then(() => {
    // le particelle si misurano con il titolo al suo posto
    disegnaTesti(5.5); preparaParticelle();
    const q = new URLSearchParams(location.search);
    if (q.has('play')) { const t0 = performance.now(); const giro = () => { disegna(((performance.now() - t0) / 1000) % DURATA); requestAnimationFrame(giro); }; giro(); }
    else disegna(Number(q.get('t') || 0));
  });
</script>
</body>
</html>
