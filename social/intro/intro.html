<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Desideri & Code · intro social</title>
<!-- Video intro per i social (motion graphics), nello stile del sito: nero, bianco e il quadratino del logo.
     Nei video il quadratino cambia colore (rosso, blu, verde, rosa, viola): ci adattiamo ai gusti di chi ci sceglie.
     Ogni fotogramma si disegna con disegna(t), t in secondi: render.mjs lo apre a 1080×1920 (Reels, TikTok, Storie)
     o 1080×1080 (post) e passa i fotogrammi a ffmpeg. ?t=5 mostra un fotogramma fermo, ?play fa partire l'animazione. -->
<style>
  @font-face { font-family: 'Tight'; src: url('../../node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Inter'; src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Mono'; src: url('../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 800; }
  :root { --notte: #0a0a0a; --latte: #ffffff; --nebbia: #a3a3a3; --q: #e30613; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--notte); color: var(--latte); }
  #scena { position: fixed; inset: 0; overflow: hidden; background: var(--notte); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .blocco { position: absolute; left: 0; right: 0; display: grid; justify-items: start; padding-left: 8%; }
  .riga { display: block; overflow: hidden; padding: .02em .1em .1em 0; }
  .riga > span { display: inline-block; }
  .titolo { font-family: 'Tight'; font-weight: 800; letter-spacing: -0.05em; line-height: .96; }
  .grigio { color: var(--nebbia); }
  .q { display: inline-block; width: .2em; height: .2em; margin-left: .05em; background: var(--q); }
  .cursore { display: inline-block; width: .2em; height: .2em; margin-left: .05em; }
  .mono { font-family: 'Mono'; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--nebbia); display: flex; align-items: center; gap: .8em; }
  .mono i { display: inline-block; width: .7em; height: .7em; }
  .servizio .q { width: .16em; height: .16em; }
  #b-firma { justify-items: center; padding-left: 0; text-align: center; }
  .icona { position: relative; background: #ffffff; }
  .icona b { position: absolute; left: 13.9%; font-family: 'Tight'; font-weight: 800; letter-spacing: -0.05em; line-height: 1; color: #0a0a0a; }
  .icona i { position: absolute; }
  .nome { font-family: 'Tight'; font-weight: 800; letter-spacing: -0.05em; line-height: 1; white-space: nowrap; }
  .motto { font-family: 'Tight'; font-weight: 600; letter-spacing: -0.02em; color: var(--latte); }
  .piede { font-family: 'Mono'; letter-spacing: .16em; text-transform: uppercase; color: var(--nebbia); }
  .riga > span.tinte { display: flex; gap: .5em; justify-content: center; }
  .tinte i { display: block; width: 1em; height: 1em; }
</style>
</head>
<body>
<div id="scena">
  <canvas id="griglia"></canvas>

  <div class="blocco" id="b-titolo">
    <span class="riga mono" id="cap1"><span><i></i>Capitolo 01 · Attenzione</span></span>
    <span class="riga titolo"><span>Trasformiamo</span></span>
    <span class="riga titolo"><span>chi ti guarda</span></span>
    <span class="riga titolo"><span>in chi ti <span id="parola">sceglie</span><span class="q" id="q-titolo"></span></span></span>
  </div>

  <div class="blocco" id="b-servizi">
    <span class="riga mono" id="cap2"><span><i></i>Cosa facciamo</span></span>
    <span class="riga titolo servizio"><span>Siti web<span class="q"></span></span></span>
    <span class="riga titolo servizio"><span>Negozi online<span class="q"></span></span></span>
    <span class="riga titolo servizio"><span>Automazioni <span class="grigio">e AI</span><span class="q"></span></span></span>
    <span class="riga titolo servizio"><span>Gestionali<span class="q"></span></span></span>
    <span class="riga titolo servizio"><span>Pubblicità<span class="q"></span></span></span>
  </div>

  <div class="blocco" id="b-firma">
    <span class="riga"><span><span class="icona" id="icona"><b id="i-1">D&amp;</b><b id="i-2">C</b><i id="i-q"></i></span></span></span>
    <span class="riga nome"><span>Desideri&amp;Code<span class="q" id="q-nome"></span></span></span>
    <span class="riga motto"><span>Il tuo sito, nei colori che piacciono a te.</span></span>
    <span class="riga"><span class="tinte" id="tinte"><i></i><i></i><i></i><i></i><i></i></span></span>
    <span class="riga piede"><span>Siti web · AI · Gestionali · Pubblicità</span></span>
    <span class="riga piede"><span>Milano · Italia e Svizzera</span></span>
  </div>
</div>

<script>
  const W = innerWidth, H = innerHeight, U = Math.min(W, H) / 1080, VERT = H / W > 1.4;
  const $ = (s) => document.querySelector(s);
  const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
  const fra = (t, a, b) => cl((t - a) / (b - a));
  const eOut = (x) => 1 - Math.pow(1 - x, 3);
  const eInOut = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const mix = (a, b, k) => a + (b - a) * k;
  let seme = 7; const rnd = () => ((seme = (seme * 16807) % 2147483647) / 2147483647);
  // i colori a scelta del sito: nei video il quadratino li attraversa tutti
  const TINTE = ['#E30613', '#1F5EFF', '#16A34A', '#FF4F9A', '#7C3AED'];
  const tinta = (t, ogni = .9) => TINTE[Math.floor(Math.max(0, t) / ogni) % TINTE.length];

  // ---------- misure (proporzionali al lato corto) ----------
  const corpo = (VERT ? 150 : 118) * U;
  document.querySelectorAll('#b-titolo .titolo').forEach((el) => { el.style.fontSize = `${corpo}px`; });
  document.querySelectorAll('.servizio').forEach((el) => { el.style.fontSize = `${(VERT ? 118 : 92) * U}px`; });
  document.querySelectorAll('.mono').forEach((el) => { el.style.fontSize = `${30 * U}px`; el.style.marginBottom = `${30 * U}px`; });
  $('#b-titolo').style.top = `${H * (VERT ? .40 : .30)}px`;
  $('#b-servizi').style.top = `${H * (VERT ? .30 : .14)}px`;
  $('#b-firma').style.top = `${H * (VERT ? .30 : .17)}px`;
  const lato = (VERT ? 260 : 210) * U;
  Object.assign($('#icona').style, { display: 'block', width: `${lato}px`, height: `${lato}px`, marginBottom: `${50 * U}px` });
  // nell'icona le lettere sono alte come nel logo: «D&» sopra, «C» sotto, il quadratino accanto alla C
  const fs = lato * 26 / 72;
  $('#i-1').style.fontSize = $('#i-2').style.fontSize = `${fs}px`;
  $('#i-1').style.top = `${lato - lato * 10 / 72 - fs * .85 - fs * .78}px`;
  $('#i-2').style.top = `${lato - lato * 10 / 72 - fs * .78}px`;
  $('.nome').style.fontSize = `${(VERT ? 150 : 128) * U}px`;
  $('.motto').style.fontSize = `${(VERT ? 50 : 42) * U}px`; $('.motto').style.marginTop = `${30 * U}px`;
  $('#tinte').style.fontSize = `${34 * U}px`; $('#tinte').parentElement.style.marginTop = `${40 * U}px`;
  document.querySelectorAll('.piede').forEach((el, i) => { el.style.fontSize = `${28 * U}px`; el.style.marginTop = `${(i ? 10 : 60) * U}px`; });
  [...$('#tinte').children].forEach((el, i) => { el.style.background = TINTE[i]; });
  const servizi = [...document.querySelectorAll('.servizio')];

  // ---------- la griglia di puntini che si raccoglie sul quadratino (come la prima schermata del sito) ----------
  const tela = $('#griglia'), g = tela.getContext('2d');
  tela.width = W; tela.height = H;
  const N = 12, P = (VERT ? 54 : 46) * U, larg = (N - 1) * P;
  const gx = (W - larg) / 2 - P * .6, gy = H * (VERT ? .30 : .47) - larg / 2;
  const qx = gx + larg + P * .7, qy = gy + larg - P * .3, ql = P * 1.25;
  const punti = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const x = gx + c * P, y = gy + r * P;
    const vicino = 1 - cl(Math.hypot(x - qx, y - qy) / (larg * 1.3));
    const a = rnd() * 6.283, d = (.4 + rnd()) * Math.max(W, H) * .7;
    punti.push({ x, y, r: mix(3, 10, vicino) * U, sx: qx + Math.cos(a) * d, sy: qy + Math.sin(a) * d, rit: rnd() * .5 });
  }
  const stelle = Array.from({ length: VERT ? 260 : 180 }, () => ({ x: rnd() * W, y: rnd() * H, r: (.6 + rnd() * 1.2) * U * 1.6, a: .12 + rnd() * .3 }));
  function disegnaGriglia(t) {
    g.clearRect(0, 0, W, H);
    // polvere di fondo, ferma, come le stelle del sito
    g.fillStyle = '#ffffff';
    for (const s of stelle) { g.globalAlpha = s.a * eOut(fra(t, 0, 1)); g.beginPath(); g.arc(s.x, s.y, s.r, 0, 6.283); g.fill(); }
    // i puntini arrivano (0-2 s), restano, poi a 3 s si stringono verso il quadratino e spariscono
    const via = eInOut(fra(t, 2.9, 3.5));
    for (const p of punti) {
      const k = eOut(fra(t, .2 + p.rit, 1.7 + p.rit));
      let x = mix(p.sx, p.x, k), y = mix(p.sy, p.y, k);
      x = mix(x, qx, via); y = mix(y, qy, via);
      g.globalAlpha = (.25 + .75 * k) * (1 - via);
      g.fillStyle = '#ffffff';
      g.beginPath(); g.arc(x, y, p.r * (1 - via * .7), 0, 6.283); g.fill();
    }
    // il quadratino: lampeggia come un cursore, poi diventa il punto del titolo
    if (t < 3.6) {
      const on = t < 2.6 ? Math.floor(t / .55) % 2 === 0 : true;
      g.globalAlpha = (on ? 1 : .15) * eOut(fra(t, .1, .5)) * (1 - fra(t, 3.4, 3.6));
      g.fillStyle = tinta(t, 1.1);
      const s = ql * (1 + .25 * via);
      g.fillRect(qx - s / 2, qy - s / 2, s, s);
    }
    g.globalAlpha = 1;
  }

  // ---------- le righe entrano ed escono da sotto una «tenda» ----------
  function riga(el, entra, esce, dur = .55) {
    const a = eOut(fra(entra, 0, dur)), b = esce == null ? 0 : eInOut(fra(esce, 0, .45));
    el.firstElementChild.style.transform = `translateY(${(1 - a) * 115 - b * 115}%)`;
    el.style.visibility = a > 0 && b < 1 ? 'visible' : 'hidden';
  }
  // l'ultima parola del titolo si riscrive, e a ogni parola il quadratino cambia colore
  const PAROLE = ['sceglie', 'scrive', 'chiama', 'sceglie'];
  function parola(t) {
    const fasi = [[0, 0], [4.6, 1], [5.4, 2], [6.2, 3]];
    let i = 0; fasi.forEach(([da], j) => { if (t >= da) i = j; });
    const [da] = fasi[i];
    if (i === 0) return [PAROLE[0], 0];
    const prima = PAROLE[i - 1], ora = PAROLE[i], k = t - da;
    const canc = Math.max(0, prima.length - Math.floor(k / .045));
    if (canc > 0) return [prima.slice(0, canc), i - 1];
    return [ora.slice(0, Math.floor((k - prima.length * .045) / .07) + 1), i];
  }
  function disegnaTesti(t) {
    const tit = [...document.querySelectorAll('#b-titolo .riga')];
    tit.forEach((el, i) => riga(el, t - (3.3 + i * .16), t - (6.9 + i * .05)));
    const [p, i] = parola(t);
    $('#parola').textContent = p;
    $('#q-titolo').style.background = TINTE[i % TINTE.length];
    document.querySelectorAll('.mono i').forEach((el) => { el.style.background = tinta(t, 1.1); });
    riga($('#cap2'), t - 7.1, t - 9.4);
    servizi.forEach((el, k) => {
      riga(el, t - (7.25 + k * .22), t - (9.45 + k * .04), .45);
      el.querySelector('.q').style.background = TINTE[k];
    });
    const fir = [...document.querySelectorAll('#b-firma .riga')];
    fir.forEach((el, k) => riga(el, t - (9.9 + k * .14), null, .6));
    // nella firma il quadratino del nome e dell'icona passa per tutti i colori
    const c = tinta(t - 10.4, .45);
    $('#q-nome').style.background = c;
    Object.assign($('#i-q').style, { background: c, width: `${lato * 7 / 72}px`, height: `${lato * 7 / 72}px`, left: `${lato * 10 / 72 + (window.larghezzaC || fs * .62) + lato * 3 / 72}px`, top: `${lato - lato * 10 / 72 - lato * 7 / 72}px` });
  }

  // ---------- un fotogramma ----------
  window.DURATA = 14;
  window.disegna = (t) => {
    disegnaGriglia(t); disegnaTesti(t);
    // dissolvenza finale breve: il video si può mettere in loop
    $('#scena').style.opacity = String(1 - fra(t, 13.7, 14));
  };
  window.pronto = Promise.all([document.fonts.load('800 100px Tight'), document.fonts.load('600 40px Tight'), document.fonts.load('500 30px Mono')]).then(() => document.fonts.ready).then(() => {
    // la C dell'icona: la larghezza vera serve per mettere il quadratino accanto
    const m = document.createElement('canvas').getContext('2d'); m.font = `800 ${fs}px Tight`;
    window.larghezzaC = m.measureText('C').width;
    const q = new URLSearchParams(location.search);
    if (q.has('play')) { const t0 = performance.now(); const giro = () => { disegna(((performance.now() - t0) / 1000) % DURATA); requestAnimationFrame(giro); }; giro(); }
    else disegna(Number(q.get('t') || 0));
  });
</script>
</body>
</html>
